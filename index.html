<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b4f7a">
<title>Fiscal Pesca</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script>try { var t = localStorage.getItem('fp-tema'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<header class="topo">
  <a href="#/" class="marca"><img src="icons/icon.svg" alt=""><span>Fiscal Pesca</span></a>
  <nav id="nav" hidden>
    <a href="#/">Pescadores</a>
    <a href="#/abordagens">Abordagens</a>
    <a href="#/guia">Guia</a>
    <a href="#/dados">Dados</a>
    <button id="btn-tema" class="sec" type="button" aria-label="Alternar tema"></button>
    <button id="btn-bloquear" class="sec" type="button" aria-label="Bloquear" title="Bloquear"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
  </nav>
</header>
<main id="app"><p class="muted">Carregando…</p></main>
<div id="aviso" role="status" aria-live="polite" hidden></div>
<div id="carregando" hidden><div class="car-caixa" role="alert" aria-busy="true">
  <svg class="car-agua" viewBox="0 0 160 70" aria-hidden="true">
    <g class="car-peixe"><path class="car-corpo" d="M20 35c14-16 40-18 56 0-16 18-42 16-56 0z"/><path class="car-cauda" d="M20 35 6 24v22z"/><circle class="car-olho" cx="64" cy="31" r="2.6"/></g>
    <circle class="car-bolha b1" cx="96" cy="40" r="2.5"/><circle class="car-bolha b2" cx="104" cy="44" r="1.8"/><circle class="car-bolha b3" cx="100" cy="48" r="1.4"/>
    <path class="car-onda" d="M0 64c20-6 40 6 60 0s40-6 60 0 40 6 40 0"/>
  </svg><p>Aguarde</p></div></div>
<script>
  // Se os scripts não carregarem (ex.: arquivo aberto pelo gerenciador de arquivos no Android), explica em vez de travar.
  setTimeout(function () {
    var m = document.getElementById('app');
    if (m && /Carregando/.test(m.textContent)) m.innerHTML = '<p><b>O app não carregou.</b></p><p>No celular, abrir o index.html pelo gerenciador de arquivos não funciona: o navegador não acessa os outros arquivos da pasta. Use o endereço https onde o app está hospedado.</p>';
  }, 4000);
</script>
<script src="lista.js" defer></script>
<script src="semaforo.js" defer></script>
<script src="normas.js" defer></script>
<script src="docs.js" defer></script>
<script src="municipios-rs.js" defer></script>
<script src="locais.js" defer></script>
<script src="vinculos.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
